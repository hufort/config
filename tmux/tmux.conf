# tmux configuration

# ── Prefix ────────────────────────────────────────────────────────────────────
# Ctrl+b (default, kept intentionally)

# ── Terminal / Colors ────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"  # true color for Ghostty
set -ag terminal-overrides ",xterm-256color:RGB"  # true color fallback

# Extended keys (preserve distinct Ctrl/Shift/Alt key combos in apps like nvim)
set -g extended-keys on
set -g extended-keys-format csi-u

# ── General ───────────────────────────────────────────────────────────────────
set -g mouse on                 # click to focus panes, scroll with trackpad
set -g base-index 1             # number windows from 1
set -g pane-base-index 1        # number panes from 1
set -sg escape-time 0           # no delay after Escape (important for vim/nvim)
set -g history-limit 10000      # lines of scrollback to keep per pane

# ── Keybindings ───────────────────────────────────────────────────────────────
# New windows and splits open in current directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation (vim-style, prefix required)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
bind r source-file ~/.tmux.conf \; display "config reloaded"

# Copy mode
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Status Bar ────────────────────────────────────────────────────────────────
set -g status-position bottom

set -g status-left " #S  "
set -g status-left-length 20

set -g status-right " %H:%M "
set -g status-right-length 10

set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bold"

# Clear default hostname pane title
set-hook -g after-new-window "select-pane -T ''"
set-hook -g after-new-session "select-pane -T ''"

